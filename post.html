<script>
  // Renders posts/<slug>.md based on the ?p= URL parameter.
  // You never need to edit this file to publish a post.
  const slug = new URLSearchParams(location.search).get("p");

  function fail(msg) {
    document.getElementById("title").textContent = "Post not found";
    document.getElementById("content").innerHTML = "<p>" + msg + "</p>";
  }

  if (!slug || !/^[a-z0-9-]+$/.test(slug)) {
    fail('No post specified. Head back to <a href="index.html#writing">the writing list</a>.');
  } else {
    // cache:"no-cache" revalidates instead of trusting a guessed freshness
    // window, so edits to a post show up on reload rather than hours later.
    Promise.all([
      fetch("posts.json", { cache: "no-cache" }).then(r => r.json()),
      fetch("posts/" + slug + ".md", { cache: "no-cache" }).then(r => { if (!r.ok) throw 0; return r.text(); })
    ])
    .then(([posts, md]) => {
      const meta = posts.find(p => p.slug === slug) || {};
      const title = meta.title || slug.replace(/-/g, " ");
      document.title = title + " — Shuge Lei";
      document.getElementById("title").textContent = title;

      const bits = [];
      if (meta.date) bits.push(meta.date);
      if (meta.tag) bits.push(meta.tag);
      bits.push(Math.max(1, Math.round(md.split(/\s+/).length / 220)) + " min");
      document.getElementById("meta").innerHTML =
        bits.map(b => "<span></span>").join("");
      document.querySelectorAll("#meta span").forEach((s, i) => { s.textContent = bits[i]; });

      document.getElementById("content").innerHTML = marked.parse(md);
    })
    .catch(() => fail('Couldn\u2019t load this post. If you\u2019re opening the file directly, run a local server first: <code>python3 -m http.server</code>'));
  }
</script>
